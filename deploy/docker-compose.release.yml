services:
  status:
    image: ${STATUS_IMAGE_REF:?STATUS_IMAGE_REF must be an immutable image reference}
    restart: unless-stopped
    init: true
    environment:
      STATUS_UPSTREAM_URL: ${STATUS_UPSTREAM_URL:?set STATUS_UPSTREAM_URL}
      STATUS_ALLOW_HTTP_UPSTREAM: "0"
      STATUS_HOME_URL: ${STATUS_HOME_URL:?set STATUS_HOME_URL}
      STATUS_POLL_INTERVAL_SECONDS: ${STATUS_POLL_INTERVAL_SECONDS:-30}
      STATUS_UPSTREAM_TIMEOUT_SECONDS: ${STATUS_UPSTREAM_TIMEOUT_SECONDS:-8}
      STATUS_CACHE_PATH: /data/status-cache.json
      STATUS_TARGETS_PATH: /data/status-targets.json
      STATUS_ADMIN_TOKEN: ${STATUS_ADMIN_TOKEN:?set STATUS_ADMIN_TOKEN}
      STATUS_VLESS_PROBE_TIMEOUT_SECONDS: ${STATUS_VLESS_PROBE_TIMEOUT_SECONDS:-12}
      STATUS_ALLOWED_HOSTS: ${STATUS_ALLOWED_HOSTS:-statuscake.shmoza.net,localhost,127.0.0.1,::1}
      STATUS_VLESS_CANARY_FILE: /run/secrets/status-vless-canaries.json
    ports:
      - 127.0.0.1:${STATUS_PORT:-18082}:8080
    volumes:
      - status-data:/data
      - ${STATUS_VLESS_CANARY_FILE_PATH:?set STATUS_VLESS_CANARY_FILE_PATH}:/run/secrets/status-vless-canaries.json:ro
    group_add:
      - ${STATUS_SECRET_GID:?set STATUS_SECRET_GID}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 8s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  status-data:
