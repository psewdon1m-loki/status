name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Static and unit checks
        run: |
          bash -n deploy/install.sh deploy/statusctl scripts/smoke_reality.sh
          python -m py_compile service/*.py deploy/*.py scripts/*.py
          node --check static/app.js
          python -m unittest discover -s tests -v
          docker compose config --quiet
      - name: Build immutable runtime shape
        run: |
          docker build --tag cake-status:test .
          docker run --rm --entrypoint python cake-status:test /app/service/selftest.py
      - name: Container smoke
        run: |
          docker run -d --name cake-status-ci -p 127.0.0.1:18082:8080 \
            -e STATUS_ALLOW_HTTP_UPSTREAM=1 \
            -e STATUS_UPSTREAM_URL=http://127.0.0.1:9/api/v1/public/status \
            -e STATUS_ALLOWED_HOSTS=statuscake.shmoza.net,127.0.0.1,localhost \
            cake-status:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Host: statuscake.shmoza.net' http://127.0.0.1:18082/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -H 'Host: statuscake.shmoza.net' http://127.0.0.1:18082/readyz
          curl --fail --silent -H 'Host: statuscake.shmoza.net' http://127.0.0.1:18082/api/v1/public/status | python -c 'import json,sys; value=json.load(sys.stdin); assert value["schemaVersion"] == 2; assert set(value["summaries"]) == {"services", "connections"}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: attacker.test' http://127.0.0.1:18082/)" = 400
          test "$(curl --silent -H 'Host: statuscake.shmoza.net' http://127.0.0.1:18082/robots.txt)" = $'User-agent: *\nDisallow: /'
      - name: End-to-end VLESS and REALITY smoke with Watcher down
        env:
          STATUS_IMAGE: cake-status:test
        run: bash scripts/smoke_reality.sh
      - name: Bounded diagnostics
        if: failure()
        run: docker logs --tail 100 cake-status-ci || true
